# yaml-language-server: $schema=https://raw.githubusercontent.com/n-framework/nfw-generators/refs/heads/main/schemas/nfw.workflow.schema.json
required_modules:
  - mediator
inputs:
  - id: Pipelines
    type: multiselect
    prompt: 'Which pipelines do you want to enable?'
    options:
      - Validation
      - Logging
      - Authorization
      - Transaction
      - Caching
    default: ['Validation']
steps:
  # Render the command class
  - action: render
    source: content/Command.cs.tera
    destination: src/core/{{ Service }}.Core.Application/Features/{{ Feature }}/Commands/{{ Name }}/{{ Name }}Command.cs
  # Render the command handler
  - action: render
    source: content/CommandHandler.cs.tera
    destination: src/core/{{ Service }}.Core.Application/Features/{{ Feature }}/Commands/{{ Name }}/{{ Name }}CommandHandler.cs
  # Render the command response
  - action: render
    source: content/CommandResponse.cs.tera
    destination: src/core/{{ Service }}.Core.Application/Features/{{ Feature }}/Commands/{{ Name }}/{{ Name }}CommandResult.cs
