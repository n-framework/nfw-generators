# yaml-language-server: $schema=../../../template.schema.json
id: dotnet-service/mediator
name: Mediator Module
description: Adds NFramework Mediator support via source-generated DI registration
version: 1.0.0
language: csharp
steps:
  # Add packages
  - action: run_command
    command: 'dotnet add src/core/{{ Service }}.Core.Application/{{ Service }}.Core.Application.csproj package Mediator.Abstractions --version 3.0.*'
  - action: run_command
    command: 'dotnet add src/core/{{ Service }}.Core.Application/{{ Service }}.Core.Application.csproj package Mediator.SourceGenerator --version 3.0.*'
  # TODO: These references are currently local for development. Change to NFramework.Mediator.Mediator packages once published.
  - action: run_command
    command: 'dotnet add src/core/{{ Service }}.Core.Application/{{ Service }}.Core.Application.csproj reference ../../../src/core-mediator-dotnet/src/NFramework.Mediator.Mediator/NFramework.Mediator.Mediator.csproj'
  - action: run_command
    command: 'dotnet add src/core/{{ Service }}.Core.Application/{{ Service }}.Core.Application.csproj reference ../../../src/core-mediator-dotnet/src/NFramework.Mediator.Mediator.Validation.FluentValidation/NFramework.Mediator.Mediator.Validation.FluentValidation.csproj'
  # Add Mediator to registration
  - action: inject
    source: 'content/mediator_registration.cs.tera'
    destination: 'src/core/{{ Service }}.Core.Application/ApplicationServiceRegistration.Nfw.g.cs'
    injection_target:
      type: region
      value: module-registrations
  - action: inject
    source: 'content/mediator_usings.cs.tera'
    destination: 'src/core/{{ Service }}.Core.Application/ApplicationServiceRegistration.Nfw.g.cs'
    injection_target:
      type: region
      value: module-usings
